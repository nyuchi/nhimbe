name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    name: lint / actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-actionlint@v1
        with:
          fail_on_error: true
          reporter: github-check

  json-validity:
    name: lint / JSON validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate every tracked .json file
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" 2>/tmp/jsonerr; then
              echo "::error file=$f::Invalid JSON: $(cat /tmp/jsonerr)"
              fail=1
            fi
          done < <(git ls-files '*.json' '*.jsonc' ':!*.gen.ts')
          exit $fail

  markdownlint:
    name: lint / markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v18

  prettier:
    name: lint / prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npx --yes prettier@3 --check . --ignore-path .prettierignore

  yamllint:
    name: lint / yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install --quiet yamllint==1.35.1
      - name: Run yamllint
        run: yamllint -c .yamllint.yml .github/
