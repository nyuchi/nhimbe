# The org-wide lint gate. Drop this file in as
# .github/workflows/lint.yml and change nothing else.
#
# The five checks it publishes are exactly the five contexts the
# org ruleset requires:
#
#   lint / actionlint
#   lint / JSON validity
#   lint / prettier
#   lint / markdownlint
#   lint / yamllint
#
# Those strings come from the job being called `lint` and calling a
# reusable workflow - a check publishes as "<caller job> / <called job>".
# Do NOT convert this to a matrix: a matrix publishes
# "lint (actionlint)" instead and will not satisfy the ruleset.
#
# Also copy .prettierrc, .prettierignore, .markdownlint.jsonc and
# .yamllint.yaml from nyuchi/.github into your repo root.

name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # DEVIATION from the canonical caller (one line). nhimbe's repo ruleset
  # 14157790 requires a MERGE QUEUE on main. Required status checks must be
  # reported on the `gh-readonly-queue/**` ref, which only a `merge_group`
  # trigger produces. Without this the queue waits out its 60-minute
  # check_response_timeout and nothing can ever land. This strengthens the
  # gate (more refs linted); it never weakens it. Fold it into the canonical
  # caller in nyuchi/.github rather than keeping it local.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    uses: nyuchi/.github/.github/workflows/reusable-lint.yml@main
