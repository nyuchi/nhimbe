# nhimbe-mcp — task-based MCP server (Cloudflare Worker)
# Part of the Mukoko ecosystem.
#
# This worker hosts ONLY the nhimbe MCP server (see src/mcp/). It owns no data:
# every tool reads/writes through the nhimbe app API. Deployed behind the
# mukoko zone at `events.mukoko.com/mcp/*` — the zone is Cloudflare-proxied (orange
# cloud) in front of Vercel, and this Worker route intercepts `/mcp/*` while
# everything else passes through to the app.
name = "nhimbe-mcp"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[vars]
ENVIRONMENT = "development"
# Extra CORS origins beyond the built-in *.nhimbe.com / *.mukoko.com allowlist.
ALLOWED_ORIGINS = "http://localhost:11825"
# Base origin of the nhimbe app. Tools call `${APP_API_URL}/api/...`.
APP_API_URL = "http://localhost:11825"
MCP_SERVER_NAME = "nhimbe"

[dev]
port = 8787
local_protocol = "http"

# Observability — logs only (mirrors the app's stance).
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

# ============================================
# PRODUCTION
# Route: events.mukoko.com/mcp/* (zone must be Cloudflare-proxied in front of Vercel).
# ============================================
[env.production]
name = "nhimbe-mcp"
vars = { ENVIRONMENT = "production", ALLOWED_ORIGINS = "https://nhimbe.com,https://www.nhimbe.com,https://mukoko.com,https://www.mukoko.com", APP_API_URL = "https://nhimbe.com", MCP_SERVER_NAME = "nhimbe" }
routes = [
  { pattern = "events.mukoko.com/mcp", zone_name = "mukoko.com" },
  { pattern = "events.mukoko.com/mcp/*", zone_name = "mukoko.com" }
]

[env.production.observability]
enabled = false
head_sampling_rate = 1

[env.production.observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

# ============================================
# STAGING
# Route: staging.events.mukoko.com/mcp/*
# ============================================
[env.staging]
name = "nhimbe-mcp-staging"
vars = { ENVIRONMENT = "staging", ALLOWED_ORIGINS = "https://staging.nhimbe.com", APP_API_URL = "https://staging.nhimbe.com", MCP_SERVER_NAME = "nhimbe (staging)" }
routes = [
  { pattern = "staging.events.mukoko.com/mcp", zone_name = "mukoko.com" },
  { pattern = "staging.events.mukoko.com/mcp/*", zone_name = "mukoko.com" }
]

[env.staging.observability]
enabled = false
head_sampling_rate = 1

[env.staging.observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true
